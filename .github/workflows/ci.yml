name: CI

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13", "3.14"]

    steps:
    - uses: actions/checkout@v4
    
    - uses: astral-sh/setup-uv@v5
      with:
        python-version: ${{ matrix.python-version }}
        enable-cache: true
    
    - run: uv sync --extra dev
    
    - name: Run tests
      run: |
        uv run pytest --cov=adamsnrc --cov-report=xml
    
    - name: Upload coverage to Codecov
      uses: codecov/codecov-action@v3
      with:
        file: ./coverage.xml
        flags: unittests
        name: codecov-umbrella

  lint:
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v4
    
    - uses: astral-sh/setup-uv@v5
      with:
        python-version: 3.12
        enable-cache: true
    
    - run: uv sync --extra dev
    
    - name: Run ruff lint
      run: uv run ruff check adamsnrc/
    
  build:
    runs-on: ubuntu-latest
    needs: [test, lint]
    
    steps:
    - uses: actions/checkout@v4
    
    - uses: astral-sh/setup-uv@v5
      with:
        python-version: 3.12
        enable-cache: true
    
    
    - name: Build package
      run: uv build
    
    - name: Check package
      run: uvx twine check dist/* 